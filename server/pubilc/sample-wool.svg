<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFD"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadowWool" x="-5%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="50" y="30" width="500" height="740" rx="16" fill="url(#bgWool)" stroke="#E2E8F0" stroke-width="2" filter="url(#shadowWool)"/>
  <line x1="70" y1="50" x2="530" y2="50" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>

  <text x="300" y="110" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="3">ATELIER WOOL</text>
  <text x="300" y="140" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">MERINO WOOL &amp; CASHMERE KNITWEAR</text>
  
  <line x1="90" y1="170" x2="510" y2="170" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="90" y="210" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700" fill="#1E293B">[품질표시]</text>
  <text x="90" y="235" font-family="'Pretendard', sans-serif" font-size="14" fill="#334155">모(Merino Wool) 80%, 캐시미어 20%</text>
  <text x="90" y="260" font-family="'Pretendard', sans-serif" font-size="13" fill="#64748B">사이즈: M (95~100) / MADE IN KOREA</text>

  <line x1="90" y1="285" x2="510" y2="285" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="300" y="325" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle">취급상 주의사항 (CARE INSTRUCTIONS)</text>

  <!-- 1. Hand Wash (Tub with Hand) -->
  <g transform="translate(75, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M15 32 L20 52 C20 54 22 56 25 56 L45 56 C48 56 50 54 50 52 L55 32 Z" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M15 34 Q25 30 35 34 T55 34" fill="none" stroke="#0284C7" stroke-width="2"/>
    <!-- Hand dipping in -->
    <path d="M30 18 L30 32 M35 15 L35 32 M40 18 L40 32 M45 22 L45 32" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 26 L26 34 C26 38 30 42 36 42 L45 42" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">손세탁 30°</text>
  </g>

  <!-- 2. Bleach Prohibited (Triangle with X) -->
  <g transform="translate(165, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="35,18 15,54 55,54" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="20" y1="26" x2="50" y2="52" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="50" y1="26" x2="20" y2="52" stroke="#EF4444" stroke-width="2.5"/>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">표백금지</text>
  </g>

  <!-- 3. Dry: Flat in shade (Square with horizontal line & diagonal stripe in corner) -->
  <g transform="translate(255, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="18" y="18" width="34" height="34" rx="3" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Shade diagonals in top left -->
    <line x1="18" y1="28" x2="28" y2="18" stroke="#1E293B" stroke-width="2"/>
    <line x1="18" y1="36" x2="36" y2="18" stroke="#1E293B" stroke-width="2"/>
    <!-- Flat horizontal line -->
    <line x1="24" y1="38" x2="46" y2="38" stroke="#1E293B" stroke-width="2.5"/>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">뉘어서그늘</text>
  </g>

  <!-- 4. Iron: Low iron with cloth (Iron with 1 dot and cloth above) -->
  <g transform="translate(345, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M18 48 L52 48 C52 48 50 36 42 36 L28 36 C22 36 18 42 18 48 Z M28 36 L28 28 L40 28" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="42" r="2" fill="#1E293B"/>
    <!-- Cloth ripple above -->
    <path d="M18 20 Q35 15 52 20" stroke="#0284C7" stroke-width="2" fill="none"/>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">천덮고저온</text>
  </g>

  <!-- 5. Dryclean: Circle with F (Petroleum solvent) -->
  <g transform="translate(435, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="35" cy="36" r="16" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <text x="35" y="42" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" fill="#1E293B" text-anchor="middle">F</text>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">석유계드라이</text>
  </g>

  <line x1="90" y1="480" x2="510" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>

  <g transform="translate(90, 510)">
    <text x="0" y="0" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#DC2626">• 회전식 열풍 건조기(텀블 건조) 절대 사용 불가</text>
    <text x="0" y="25" font-family="'Pretendard', sans-serif" font-size="13" fill="#475569">• 울 전용 중성세제를 사용하여 30℃ 이하 미온수 손세탁</text>
    <text x="0" y="50" font-family="'Pretendard', sans-serif" font-size="13" fill="#475569">• 탈수 시 비틀어 짜지 말고 수건으로 가볍게 수분 흡수</text>
    <text x="0" y="75" font-family="'Pretendard', sans-serif" font-size="13" fill="#475569">• 평평한 바닥에 뉘어서 그늘에 건조 (옷걸이 금지)</text>
    <text x="0" y="100" font-family="'Pretendard', sans-serif" font-size="13" fill="#475569">• 전문 세탁소 의뢰 시 석유계 용제(F) 지정</text>
  </g>

  <g transform="translate(190, 660)">
    <rect x="0" y="0" width="220" height="40" fill="#1E293B" opacity="0.05"/>
    <line x1="15" y1="5" x2="15" y2="35" stroke="#1E293B" stroke-width="3"/>
    <line x1="28" y1="5" x2="28" y2="35" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="38" y1="5" x2="38" y2="35" stroke="#1E293B" stroke-width="4"/>
    <line x1="55" y1="5" x2="55" y2="35" stroke="#1E293B" stroke-width="2"/>
    <line x1="70" y1="5" x2="70" y2="35" stroke="#1E293B" stroke-width="5"/>
    <line x1="90" y1="5" x2="90" y2="35" stroke="#1E293B" stroke-width="2"/>
    <line x1="110" y1="5" x2="110" y2="35" stroke="#1E293B" stroke-width="4"/>
    <line x1="130" y1="5" x2="130" y2="35" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="150" y1="5" x2="150" y2="35" stroke="#1E293B" stroke-width="3"/>
    <line x1="170" y1="5" x2="170" y2="35" stroke="#1E293B" stroke-width="5"/>
    <line x1="195" y1="5" x2="195" y2="35" stroke="#1E293B" stroke-width="2"/>
    <text x="110" y="52" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="3">8809876543210</text>
  </g>
</svg>
