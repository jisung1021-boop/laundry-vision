<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSilk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDF8F6"/>
    </linearGradient>
    <filter id="shadowSilk" x="-5%" y="-3%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="50" y="30" width="500" height="740" rx="16" fill="url(#bgSilk)" stroke="#F1E3D3" stroke-width="2" filter="url(#shadowSilk)"/>
  <line x1="70" y1="50" x2="530" y2="50" stroke="#D7C4B7" stroke-width="2" stroke-dasharray="6,4"/>

  <text x="300" y="110" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#7C2D12" text-anchor="middle" letter-spacing="4">MAISON DE SOIE</text>
  <text x="300" y="140" font-family="'Pretendard', sans-serif" font-size="14" font-weight="500" fill="#9A3412" text-anchor="middle">100% PURE MULBERRY SILK BLOUSE</text>
  
  <line x1="90" y1="170" x2="510" y2="170" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="90" y="210" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700" fill="#1E293B">[품질표시]</text>
  <text x="90" y="235" font-family="'Pretendard', sans-serif" font-size="14" fill="#334155">소재: 실크(견) 100% (PURE SILK)</text>
  <text x="90" y="260" font-family="'Pretendard', sans-serif" font-size="13" fill="#64748B">호칭: 55 (S) / 제조국: 이탈리아 (ITALY)</text>

  <line x1="90" y1="285" x2="510" y2="285" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="300" y="325" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle">취급상 주의사항 (CARE LABELS)</text>

  <!-- 1. Wash: PROHIBITED (Tub with X) -->
  <g transform="translate(75, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M15 30 L20 52 C20 54 22 56 25 56 L45 56 C48 56 50 54 50 52 L55 30 Z" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M15 32 Q25 28 35 32 T55 32" fill="none" stroke="#0284C7" stroke-width="2"/>
    <line x1="20" y1="24" x2="50" y2="56" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="50" y1="24" x2="20" y2="56" stroke="#EF4444" stroke-width="2.5"/>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">물세탁금지</text>
  </g>

  <!-- 2. Bleach: PROHIBITED (Triangle with X) -->
  <g transform="translate(165, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="35,18 15,54 55,54" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="20" y1="26" x2="50" y2="52" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="50" y1="26" x2="20" y2="52" stroke="#EF4444" stroke-width="2.5"/>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">표백금지</text>
  </g>

  <!-- 3. Dry: TUMBLE NO (Square with circle and X) -->
  <g transform="translate(255, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="18" y="18" width="34" height="34" rx="3" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="35" cy="35" r="13" fill="none" stroke="#1E293B" stroke-width="2"/>
    <line x1="20" y1="20" x2="50" y2="50" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="50" y1="20" x2="20" y2="50" stroke="#EF4444" stroke-width="2.5"/>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">건조기금지</text>
  </g>

  <!-- 4. Iron: Low iron with cloth and no steam (Iron with 1 dot and cloth) -->
  <g transform="translate(345, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M18 48 L52 48 C52 48 50 36 42 36 L28 36 C22 36 18 42 18 48 Z M28 36 L28 28 L40 28" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="42" r="2" fill="#1E293B"/>
    <path d="M18 20 Q35 15 52 20" stroke="#0284C7" stroke-width="2" fill="none"/>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">천덮고저온</text>
  </g>

  <!-- 5. Dryclean: Circle with F (Petroleum solvent) -->
  <g transform="translate(435, 360)">
    <rect width="70" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="35" cy="36" r="16" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <text x="35" y="42" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" fill="#1E293B" text-anchor="middle">F</text>
    <text x="35" y="86" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">석유계드라이</text>
  </g>

  <line x1="90" y1="480" x2="510" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>

  <g transform="translate(90, 510)">
    <text x="0" y="0" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#DC2626">• 물세탁 절대 금지 (원단 수축 및 워터스팟 발생)</text>
    <text x="0" y="25" font-family="'Pretendard', sans-serif" font-size="13" fill="#475569">• 반드시 전문 세탁소에 실크 전용 석유계 드라이클리닝 의뢰</text>
    <text x="0" y="50" font-family="'Pretendard', sans-serif" font-size="13" fill="#475569">• 스팀 분사 금지 / 저온(110℃ 이하) 헝겊 덮고 다림질</text>
    <text x="0" y="75" font-family="'Pretendard', sans-serif" font-size="13" fill="#475569">• 텀블 건조기 사용 불가 / 통풍되는 그늘에 보관</text>
    <text x="0" y="100" font-family="'Pretendard', sans-serif" font-size="13" fill="#475569">• 향수나 땀이 직접 닿지 않도록 주의 (황변 유발)</text>
  </g>

  <g transform="translate(190, 660)">
    <rect x="0" y="0" width="220" height="40" fill="#1E293B" opacity="0.05"/>
    <line x1="15" y1="5" x2="15" y2="35" stroke="#1E293B" stroke-width="2"/>
    <line x1="30" y1="5" x2="30" y2="35" stroke="#1E293B" stroke-width="3"/>
    <line x1="45" y1="5" x2="45" y2="35" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="60" y1="5" x2="60" y2="35" stroke="#1E293B" stroke-width="4"/>
    <line x1="80" y1="5" x2="80" y2="35" stroke="#1E293B" stroke-width="2"/>
    <line x1="100" y1="5" x2="100" y2="35" stroke="#1E293B" stroke-width="5"/>
    <line x1="120" y1="5" x2="120" y2="35" stroke="#1E293B" stroke-width="2"/>
    <line x1="140" y1="5" x2="140" y2="35" stroke="#1E293B" stroke-width="3.5"/>
    <line x1="160" y1="5" x2="160" y2="35" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="180" y1="5" x2="180" y2="35" stroke="#1E293B" stroke-width="4"/>
    <line x1="205" y1="5" x2="205" y2="35" stroke="#1E293B" stroke-width="2"/>
    <text x="110" y="52" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="3">8001928374650</text>
  </g>
</svg>
